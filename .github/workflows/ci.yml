name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build extension
        run: npm run compile

      - name: Build tests
        run: npm run compile-tests

      - name: Run extension tests
        run: xvfb-run -a npm test
